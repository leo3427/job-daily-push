name: 每日岗位自动推送
on:
  schedule:
    - cron: '0 0 * * *'  # UTC 0点 = 北京时间早8点
  workflow_dispatch:      # 支持手动触发测试

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 安装Python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖库
        run: pip install feedparser requests

      - name: 运行岗位收集脚本
        env:
          EMAIL_AUTH_CODE: ${{ secrets.EMAIL_AUTH_CODE }}
          SERVER_CHAN_KEY: ${{ secrets.SERVER_CHAN_KEY }}
        run: python job_collector.py

      - name: 保存去重历史记录
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pushed_jobs_history.json
          git commit -m "更新岗位去重历史" || echo "无更新，跳过提交"
          git push
